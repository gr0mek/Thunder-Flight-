[project]
name = "flightwatch"
version = "0.1.0"
description = "Osobisty monitor cen lotów – alerty Telegram i panel webowy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[project.scripts]
flightwatch-panel = "flightwatch.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightwatch"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # polskie teksty: en dash, ×, NBSP

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["flightwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
